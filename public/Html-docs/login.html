<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Belleful</title>
    
    <!-- Same CDNs as index.html -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="container">
        <div class="contact-box">
            <div class="left">
                <a class="login-brand" href="index.html">
                <i class="fas fa-utensils me-2"></i>Bellefull
            </a>
            </div>
            <div class="right">
                <h2> Login</h2>
                <form id="loginForm" class="login-form" onsubmit="AuthManager.login(event)">
                    <input id="loginEmail" name="email" type="email" class="field" placeholder="Enter Your Email" required>
                    <div class="password-wrapper">
                        <input id="loginPassword" name="password" type="password" class="password-field" placeholder="Enter Your Password" required>
                        <button id="togglePassword" type="button" aria-label="Show password" class="password-toggle">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <p class="sign-up text">Don't have an account yet <a href="signup.html" class="sign-up-btn">Sign up</a></p>
                    <a href="OTP.html">Forgot password</a>
                    <button id="loginFormSubmit" class="btn" type="submit">Login</button>
                </form>
            </div>
        </div> 
    </div>
    <!-- Auth scripts: constants first, then auth logic -->
    <script src="../js/constants.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
