<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard - Belleful</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="css/staff-dashboard.css">
    <link rel="stylesheet" href="css/logo.css">
</head>
<body>
    <!-- Sidebar Toggle Functions - Prevents undefined errors -->
    <script>
        // Inline definitions like user-dashboard - executes immediately
        window.setActiveNav = function(section) {
            document.querySelectorAll('.sidebar-nav .nav-link').forEach(link => link.classList.remove('active'));
            const activeLink = document.querySelector(`.sidebar-nav a[href="#${section}"]`) || event?.target?.closest('.nav-link');
            if (activeLink) activeLink.classList.add('active');
            
            const target = document.getElementById(section);
            if (target) {
                const navbarHeight = 80;
                const targetPosition = target.getBoundingClientRect().top + window.pageYOffset - navbarHeight - 20;
                window.scrollTo({ top: targetPosition, behavior: 'smooth' });
            }
            
            window.closeSidebar?.();
            // Call staff manager if exists
            if (window.StaffDashboardManager) {
                window.StaffDashboardManager.showSection(section);
            }
        };

        window.toggleSidebar = function() {
            const sidebar = document.getElementById('staffSidebar');
            const backdrop = document.getElementById('sidebarBackdrop');
            const isOpen = sidebar && sidebar.classList.contains('show');
            if (sidebar) sidebar.classList.toggle('show');
            if (backdrop) {
                backdrop.classList.toggle('show', !isOpen);
            }
            if (!sidebar?.classList?.contains('show')) {
                document.body.style.overflow = '';
                document.body.style.paddingRight = '';
            } else {
                document.body.style.overflow = 'hidden';
                const scrollBarWidth = window.innerWidth - document.documentElement.clientWidth;
                document.body.style.paddingRight = scrollBarWidth + 'px';
            }
        };

        window.closeSidebar = function() {
            const sidebar = document.getElementById('staffSidebar');
            const backdrop = document.getElementById('sidebarBackdrop');
            if (sidebar) sidebar.classList.remove('show');
            if (backdrop) backdrop.classList.remove('show');
            document.body.style.overflow = '';
            document.body.style.paddingRight = '';
        };

        // Responsive auto-close
        if (window.addEventListener) {
            window.addEventListener('resize', () => {
                if (window.innerWidth >= 992) window.closeSidebar();
            });
        }
    </script>

    <!-- Top Navbar - Simplified (no dropdown) -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top bg-gradient-staff shadow-lg">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold fs-4" href="#">
                <i class="fas fa-user-tie me-2"></i>Belleful Staff
            </a>
            <!-- Sidebar Toggle Button -->
            <button class="sidebar-toggle btn btn-link text-white p-2 ms-3 me-lg-0 me-xl-3 d-block" type="button" onclick="toggleSidebar()" title="Toggle Menu" aria-label="Toggle sidebar menu">
                <i class="fas fa-bars fa-lg sidebar-hamburger"></i>
            </button>
        </div>
    </nav>

    <!-- Sidebar Backdrop & Sidebar (MATCHES user-dashboard exactly) -->
    <div class="sidebar-backdrop d-none" id="sidebarBackdrop" onclick="closeSidebar()"></div>
    <div class="sidebar" id="staffSidebar">
        <div class="sidebar-content">
            <!-- Profile Header -->
            <div id="sidebarProfile" class="profile-card">
                <div class="p-4 text-center text-muted">
                    <div class="rounded-circle bg-light d-flex align-items-center justify-content-center mb-3 mx-auto" style="width: 70px; height: 70px;">
                        <i class="fas fa-user-tie fa-lg text-staff-primary"></i>
                    </div>
                    <h6 class="fw-bold mb-2 text-staff-primary">Staff Account</h6>
                    <p class="small mb-0">Dashboard Menu</p>
                </div>
            </div>
            
            <!-- Sidebar Navigation -->
            <nav class="sidebar-nav p-0">
                <a href="#staff-orders" class="nav-link active" onclick="setActiveNav('staff-orders')">
                    <i class="fas fa-clock"></i><span>Pending Orders</span>
                </a>
                <a href="#staff-profile" class="nav-link" onclick="setActiveNav('staff-profile'); StaffDashboardManager?.showProfileForm?.();">
                    <i class="fas fa-user-cog"></i><span>Profile & Settings</span>
                </a>
                <a href="#" class="nav-link text-danger" onclick="closeSidebar(); StaffDashboardManager?.logout?.() || logout()">
                    <i class="fas fa-sign-out-alt"></i><span>Logout</span>
                </a>
            </nav>
        </div>
    </div>

    <!-- App Wrapper -->
    <div class="app-wrapper">
        <div class="main-content">
            <!-- Staff Stats -->
            <section id="staff-stats" class="mb-5">
                <div class="row g-4 mb-5" id="staffStats">
                    <!-- Stats loaded by JS -->
                </div>
            </section>

            <!-- Pending Orders Section -->
            <section id="staff-orders">
                <div class="card shadow-xl border-0 rounded-4 mb-5">
                    <div class="card-header bg-staff-primary text-white">
                        <h4 class="mb-0 fw-bold">
                            <i class="fas fa-clock me-2"></i>Pending / Preparing Orders 
                            <span class="badge bg-light text-staff-primary ms-2" id="staffPendingCount">0</span>
                        </h4>
                    </div>
                    <div class="card-body p-0">
                        <!-- Orders Filter -->
                        <div class="p-4 border-bottom">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <input type="text" class="form-control" id="staffOrdersSearch" placeholder="Search orders..." oninput="StaffDashboardManager?.loadStaffOrders()">
                                </div>
                                <div class="col-md-3">
                                    <select class="form-select" id="staffOrderStatusFilter" title="Filter orders" onchange="StaffDashboardManager?.loadStaffOrders(1, '', this.value)">
                                        <option value="">All Pending</option>
                                        <option value="pending_approval">Pending Approval</option>
                                        <option value="preparing">Preparing</option>
                                        <option value="ready_for_pickup">Ready for Pickup</option>
                                        <option value="delivered">Delivered</option>
                                    </select>
                                </div>
                                <div class="col-md-2">
                                    <button class="btn btn-outline-staff-primary" onclick="StaffDashboardManager?.loadStaffOrders()">
                                        <i class="fas fa-refresh"></i> Refresh
                                    </button>
                                </div>
                                <!-- Profile Section (unchanged) -->
                                <section id="staff-profile" class="profile-section mb-5" style="display: none;">
                                    <div class="card shadow-xl border-0 rounded-4">
                                        <div class="card-header bg-gradient-profile text-white">
                                            <h4 class="mb-0 fw-bold">
                                                <i class="fas fa-user me-2"></i>My Profile
                                            </h4>
                                        </div>
                                        <div class="card-body p-4">
                                            <form id="profileUpdateForm" enctype="multipart/form-data">
                                                <div class="row">
                                                    <div class="col-md-4 text-center mb-4">
                                                        <div class="profile-avatar-container position-relative">
                                                            <img id="profileAvatar" src="" alt="Avatar" class="rounded-circle shadow-lg mb-3" style="width: 150px; height: 150px; object-fit: cover;">
                                                            <label for="avatarInput" class="avatar-upload-btn position-absolute bottom-0 end-0 bg-primary text-white rounded-circle p-2 shadow" title="Change photo">
                                                                <i class="fas fa-camera"></i>
                                                            </label>
                                                            <input type="file" id="avatarInput" name="avatar" accept="image/*" class="d-none" onchange="StaffDashboardManager.previewAvatar(event)">
                                                        </div>
                                                        <p id="profileEmail" class="text-muted mb-0"></p>
                                                    </div>
                                                    <div class="col-md-8">
                                                        <div class="row g-3">
                                                            <div class="col-md-8">
                                                                <label class="form-label fw-bold">Full Name</label>
                                                                <input type="text" class="form-control" id="profileName" name="name" required>
                                                            </div>
                                                            <div class="col-md-4">
                                                                <label class="form-label fw-bold">Role</label>
                                                                <input type="text" class="form-control bg-light" id="profileRole" readonly>
                                                            </div>
                                                        </div>
                                                        <div class="mt-4">
                                                            <button type="submit" class="btn btn-primary btn-lg me-2" id="updateProfileBtn">
                                                                <span class="btn-text"><i class="fas fa-save me-2"></i>Update Profile</span>
                                                                <span class="spinner-border spinner-border-sm d-none" role="status"></span>
                                                            </button>
                                                            <button type="button" class="btn btn-outline-secondary btn-lg" onclick="StaffDashboardManager.hideProfileForm()">
                                                                <i class="fas fa-times me-2"></i>Cancel
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </form>
                                        </div>
                                    </div>
                                </section>
                            </div>
                        </div>
                        <!-- Table -->
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Customer</th>
                                        <th>Items</th>
                                        <th>Total</th>
                                        <th>Status</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="staffOrdersTable">
                                    <!-- Orders loaded here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- Order Details Modal (unchanged) -->
    <div class="modal fade" id="staffOrderModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header bg-staff-primary text-white">
                    <h5 class="modal-title">
                        <i class="fas fa-file-invoice-dollar me-2"></i>
                        <span id="staffOrderModalTitle">Order Details</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="staffOrderModalBody">
                    <!-- Order details populated by JS -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/staff-dashboard.js"></script>
    <script>
        AOS.init();
        // StaffDashboardManager auto-initializes
    </script>
</body>
</html>
