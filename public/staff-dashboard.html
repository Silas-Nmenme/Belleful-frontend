<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard - Belleful</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="css/staff-dashboard.css">
    <link rel="stylesheet" href="css/logo.css">
</head>
<body>
    <!-- Sidebar Toggle Functions - Prevents undefined errors -->
    <script>
        // Inline definitions like user-dashboard - executes immediately
        window.setActiveNav = function(section) {
            document.querySelectorAll('.sidebar-nav .nav-link').forEach(link => link.classList.remove('active'));
            const activeLink = document.querySelector(`.sidebar-nav a[href="#${section}"]`) || event?.target?.closest('.nav-link');
            if (activeLink) activeLink.classList.add('active');
            
            const target = document.getElementById(section);
            if (target) {
                const navbarHeight = 80;
                const targetPosition = target.getBoundingClientRect().top + window.pageYOffset - navbarHeight - 20;
                window.scrollTo({ top: targetPosition, behavior: 'smooth' });
            }
            
            window.closeSidebar?.();
            // Call staff manager if exists
            if (window.StaffDashboardManager) {
                window.StaffDashboardManager.showSection(section);
            }
        };

        window.toggleSidebar = function() {
            const sidebar = document.getElementById('staffSidebar');
            const backdrop = document.getElementById('sidebarBackdrop');
            const isOpen = sidebar && sidebar.classList.contains('show');
            if (sidebar) sidebar.classList.toggle('show');
            if (backdrop) {
                backdrop.classList.toggle('show', !isOpen);
            }
            if (!sidebar?.classList?.contains('show')) {
                document.body.style.overflow = '';
                document.body.style.paddingRight = '';
            } else {
                document.body.style.overflow = 'hidden';
                const scrollBarWidth = window.innerWidth - document.documentElement.clientWidth;
                document.body.style.paddingRight = scrollBarWidth + 'px';
            }
        };

        window.closeSidebar = function() {
            const sidebar = document.getElementById('staffSidebar');
            const backdrop = document.getElementById('sidebarBackdrop');
            if (sidebar) sidebar.classList.remove('show');
            if (backdrop) backdrop.classList.remove('show');
            document.body.style.overflow = '';
            document.body.style.paddingRight = '';
        };

        // Responsive auto-close
        if (window.addEventListener) {
            window.addEventListener('resize', () => {
                if (window.innerWidth >= 992) window.closeSidebar();
            });
        }
    </script>

    <!-- Top Navbar - Simplified (no dropdown) -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top bg-gradient-staff shadow-lg">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold fs-4" href="#">
                <i class="fas fa-user-tie me-2"></i>Belleful Staff
            </a>
            <!-- Sidebar Toggle Button -->
            <button class="sidebar-toggle btn btn-link text-white p-2 ms-3 me-lg-0 me-xl-3 d-block" type="button" onclick="toggleSidebar()" title="Toggle Menu" aria-label="Toggle sidebar menu">
                <i class="fas fa-bars fa-lg sidebar-hamburger"></i>
            </button>
        </div>
    </nav>

    <!-- Sidebar Backdrop & Sidebar (MATCHES user-dashboard exactly) -->
    <div class="sidebar-backdrop d-none" id="sidebarBackdrop" onclick="closeSidebar()"></div>
    <div class="sidebar" id="staffSidebar">
        <div class="sidebar-content">
            <!-- Profile Header -->
            <div id="sidebarProfile" class="profile-card">
                <div class="p-4 text-center text-muted">
<img id="staffSidebarAvatarPreview" src="" alt="Staff profile picture" class="rounded-circle shadow" style="width: 70px; height: 70px; object-fit: cover; display: none;">
                    <div id="staffSidebarAvatarPlaceholder" class="rounded-circle bg-light d-flex align-items-center justify-content-center" style="width: 70px; height: 70px;">
                        <i class="fas fa-user-tie fa-lg text-staff-primary"></i>
                    </div>
                    <h6 class="fw-bold mb-2 text-staff-primary">Staff Account</h6>
                    <p class="small mb-0">Dashboard Menu</p>
                </div>
            </div>
            
            <!-- Sidebar Navigation -->
            <nav class="sidebar-nav p-0">
<a href="#" class="nav-link active" onclick="setActiveNav('staff-dashboard')">
                    <i class="fas fa-tachometer-alt"></i><span>Dashboard</span>
                </a>
                <a href="#staff-orders" class="nav-link" onclick="setActiveNav('staff-orders')">
                    <i class="fas fa-clock"></i><span>Pending Orders</span>
                </a>
<a href="#staff-profile" class="nav-link" onclick="setActiveNav('staff-profile'); StaffDashboardManager?.showProfileModal?.();">
                    <i class="fas fa-user-cog"></i><span>Profile & Settings</span>
                </a>
                <a href="#" class="nav-link text-danger" onclick="closeSidebar(); StaffDashboardManager?.logout?.() || logout()">
                    <i class="fas fa-sign-out-alt"></i><span>Logout</span>
                </a>
            </nav>
        </div>
    </div>

    <!-- App Wrapper -->
    <div class="app-wrapper">
        <div class="main-content">
            <!-- Staff Stats -->
            <section id="staff-stats" class="mb-5">
                <div class="row g-4 mb-5" id="staffStats">
                    <!-- Stats loaded by JS -->
                </div>
            </section>

            <!-- Pending Orders Section -->
            <section id="staff-orders">
                <div class="card shadow-xl border-0 rounded-4 mb-5">
                    <div class="card-header bg-staff-primary text-white">
                        <h4 class="mb-0 fw-bold">
                            <i class="fas fa-clock me-2"></i>Pending / Preparing Orders 
                            <span class="badge bg-light text-staff-primary ms-2" id="staffPendingCount">0</span>
                        </h4>
                    </div>
                    <div class="card-body p-0">
                        <!-- Orders Filter -->
                        <div class="p-4 border-bottom">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <input type="text" class="form-control" id="staffOrdersSearch" placeholder="Search orders..." oninput="StaffDashboardManager?.loadStaffOrders()">
                                </div>
                                <div class="col-md-3">
                                    <select class="form-select" id="staffOrderStatusFilter" title="Filter orders" onchange="StaffDashboardManager?.loadStaffOrders(1, '', this.value)">
                                        <option value="">All Pending</option>
                                        <option value="pending_approval">Pending Approval</option>
                                        <option value="preparing">Preparing</option>
                                        <option value="ready_for_pickup">Ready for Pickup</option>
                                        <option value="delivered">Delivered</option>
                                    </select>
                                </div>
                                <div class="col-md-2">
                                    <button class="btn btn-outline-staff-primary" onclick="StaffDashboardManager?.loadStaffOrders()">
                                        <i class="fas fa-refresh"></i> Refresh
                                    </button>
                                </div>

                            </div>
                        </div>
                        <!-- Table -->
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Customer</th>
                                        <th>Items</th>
                                        <th>Total</th>
                                        <th>Status</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="staffOrdersTable">
                                    <!-- Orders loaded here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- Order Details Modal (unchanged) -->
    <div class="modal fade" id="staffOrderModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header bg-staff-primary text-white">
                    <h5 class="modal-title">
                        <i class="fas fa-file-invoice-dollar me-2"></i>
                        <span id="staffOrderModalTitle">Order Details</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="staffOrderModalBody">
                    <!-- Order details populated by JS -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Staff Profile Modal (like user-dashboard.html) -->
    <div class="modal fade" id="staffProfileModal" tabindex="-1" aria-labelledby="staffProfileModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-staff-primary text-white">
                    <h5 class="modal-title" id="staffProfileModalLabel">
                        <i class="fas fa-user-cog me-2"></i>Profile Settings
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="staffProfileForm" enctype="multipart/form-data">
                    <div class="modal-body">
                        <input type="hidden" id="staffCurrentAvatar" name="currentAvatar">
                        
                        <div class="mb-4">
                            <div class="avatar-preview mb-3 text-center">
                                <img id="staffAvatarPreview" src="" alt="Profile avatar preview" class="rounded-circle shadow-lg" style="width: 120px; height: 120px; object-fit: cover; border: 4px solid #4f46e5;">
                                <div id="staffAvatarPlaceholder" class="rounded-circle bg-light d-flex align-items-center justify-content-center" style="width: 120px; height: 120px; display: none;">
                                    <i class="fas fa-user fa-2x text-muted"></i>
                                </div>
                            </div>
                            <label for="staffAvatarInput" class="form-label">
                                <i class="fas fa-camera me-1"></i>Change Profile Picture
                            </label>
                            <input type="file" class="form-control d-none" id="staffAvatarInput" name="avatar" accept="image/*" onchange="StaffDashboardManager.previewAvatar(event)">
                            <button type="button" class="btn btn-outline-staff-primary btn-sm mt-2" onclick="document.getElementById('staffAvatarInput').click()">
                                <i class="fas fa-upload me-1"></i>Choose Image
                            </button>
                            <div class="form-text">Square images (1:1) work best. Max 5MB.</div>
                        </div>

                        <div class="mb-3">
                            <label for="staffNameInput" class="form-label fw-bold">
                                <i class="fas fa-user me-1"></i>Display Name
                            </label>
                            <input type="text" class="form-control" id="staffNameInput" name="name" maxlength="50" required>
                            <div class="form-text">2-50 characters. Used everywhere in app.</div>
                        </div>

                        <div class="text-center">
                            <div class="form-text text-muted mb-3">
                                Email: <span id="staffProfileEmail" class="fw-medium"></span> (not editable)
                            </div>
                        </div>

                        <div id="staffUploadProgress" class="progress mb-3 d-none" style="height: 6px;">
                            <div class="progress-bar" role="progressbar" style="width: 0%"></div>
                        </div>
                        <div id="staffFormError" class="alert alert-danger d-none" role="alert"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="staffProfileSubmit">
                            <i class="fas fa-save me-1"></i>Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/staff-dashboard.js"></script>
    <script>
        AOS.init();
        // StaffDashboardManager auto-initializes
    </script>
</body>
</html>
