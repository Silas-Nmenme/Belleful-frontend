<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - Belleful</title>
    
    <!-- CDNs -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="css/staff-login.css">
    <link rel="stylesheet" href="css/logo.css">
</head>
<body class="pt-5">
    <!-- Navigation - like admin-login.html -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top bg-gradient-warm shadow-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">
              <img src="asset/logo.jpeg" alt="Belleful" class="navbar-brand-logo" loading="lazy">
              <span>Belleful</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" 
            aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#menu" id="menuLink">Menu</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cart.html">
                            <i class="fas fa-shopping-cart"></i> Cart 
                            <span class="badge bg-danger cart-count hidden">0</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact-us.html">Contact</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user"></i> Account
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="login.html">Customer Login</a></li>
                            <li><a class="dropdown-item" href="admin-login.html">Admin Login</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item active fw-bold" href="staff-login.html">Staff Login</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container pt-4">
        <div class="contact-box">
            <!-- Left Panel - Staff Welcome -->
            <div class="left">
                <i class="fas fa-user-tie"></i>
                <span>Staff Portal</span>
            </div>
            
            <!-- Right Panel - Login Form -->
            <div class="right">
                <h2>Staff Login</h2>
                <p class="text-muted mb-4">Access pending orders &amp; order preparation</p>
                <form id="staffLoginForm" class="login-form">
                    <input id="staffEmail" name="email" type="email" class="field" placeholder="staff@belleful.com" required>
                    <div class="password-wrapper">
                        <input id="staffPassword" name="password" type="password" class="field password-field" placeholder="Enter password" required>
                        <button type="button" id="toggleStaffPassword" class="password-toggle" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <button id="staffLoginSubmit" class="btn" type="submit">
                        <i class="fas fa-sign-in-alt me-2"></i>Staff Login
                    </button>
                    <div class="forgot-password">
                        <a href="reset-password.html">
                            <i class="fas fa-key me-1"></i>Forgot Password?
                        </a>
                    </div>
                </form>
            </div>
        </div> 
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/staff-auth.js"></script>
    <script src="js/cart.js"></script>
   

    <script>
AOS.init({ duration: 1200, once: true });

document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('staffLoginForm');
    const toggleBtn = document.getElementById('toggleStaffPassword');
    const passwordField = document.getElementById('staffPassword');
    const submitBtn = document.getElementById('staffLoginSubmit');

    // Use StaffAuthManager (loaded via staff-auth.js)
    form.onsubmit = function(e) {
        return window.StaffAuthManager?.login(e, submitBtn) || false;
    };

    // Password toggle (keep existing)
    toggleBtn.addEventListener('click', function() {
        const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordField.setAttribute('type', type);
        const icon = this.querySelector('i');
        icon.classList.toggle('fa-eye');
        icon.classList.toggle('fa-eye-slash');
    });

    console.log('✅ Staff login integrated with auth.js + StaffAuthManager');
});
</script>
