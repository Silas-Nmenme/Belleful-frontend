<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - Belleful</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="css/index.css" rel="stylesheet">
  <link href="css/cart.css" rel="stylesheet">
</head>
<body class="bg-light">
  <!-- Navbar - Logged-in only, dashboard-focused -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top bg-gradient-warm shadow-lg">
    <div class="container">
      <a class="navbar-brand" href="user-dashboard.html">
        <i class="fas fa-utensils me-2"></i>Belleful
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="user-dashboard.html">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="user-dashboard.html#menu">Menu</a>
          </li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item position-relative">
            <a class="nav-link" href="cart.html">
              <i class="fas fa-shopping-cart fs-5"></i>
              <span class="badge bg-danger cart-badge cart-count hidden position-absolute top-0 start-100 translate-middle" id="cartBadge">0</span>
            </a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown">
              <img class="rounded-circle me-2" src="https://ui-avatars.com/api/?name=User&background=667eea&color=fff&size=32" width="32" height="32" alt="Profile">
              <span id="profileName">User</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="user-dashboard.html"><i class="fas fa-tachometer-alt me-2"></i>Dashboard</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><button class="dropdown-item text-danger" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i>Logout</button></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="cart-container pt-5">
    <!-- Header -->
    <div class="cart-header pb-4 mb-4">
      <a href="user-dashboard.html" class="btn btn-back">
        <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
      </a>
      <h1>My Cart</h1>
    </div>

    <div class="row g-4">
      <!-- Cart Items -->
      <div class="col-lg-8">
        <div class="cart-items-grid" id="cartItems"></div>
      </div>

      <!-- Summary Sidebar -->
      <div class="col-lg-4">
        <div class="cart-summary sticky-top" style="top: 100px;"></div>
      </div>
    </div>
  </div>

  <!-- Auth check - redirect if not logged in -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const token = localStorage.getItem('token');
      if (!token) {
        if (typeof showToast === 'function') {
          showToast('Please login to access cart', 'warning');
        }
        window.location.href = 'login.html';
        return;
      }

      // Update profile name
      const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
      const profileName = document.getElementById('profileName');
      if (profileName) {
        profileName.textContent = user.name || 'User';
      }

      // Load cart
      if (typeof loadCart === 'function') {
        loadCart();
      }
    });

    function logout() {
      localStorage.clear();
      window.location.href = 'login.html';
    }
  </script>
  
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Project JS -->
  <script src="js/constants.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/navigation.js"></script>

</body>
</html>
