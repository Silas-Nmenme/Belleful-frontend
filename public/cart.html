<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - Belleful</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="css/index.css" rel="stylesheet">
  <link href="css/cart.css" rel="stylesheet">
</head>
<body class="bg-light">
  <!-- Navbar - Matches other pages -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold fs-3" href="index.html">
        <img src="asset/logo.jpeg" alt="Belleful" width="40" height="40" class="rounded-circle me-2">
        Belleful
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="user-dashboard.html">Dashboard</a></li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item position-relative">
            <a class="nav-link position-relative" href="cart.html" title="Shopping Cart" aria-label="Shopping Cart">
              <i class="fas fa-shopping-cart fs-5" aria-hidden="true"></i>
              <span class="badge bg-danger cart-badge cart-count hidden position-absolute top-0 start-100 translate-middle" id="cartBadge">0</span>
            </a>
          </li>
          <li class="nav-item"><a class="nav-link" href="user-dashboard.html"><i class="fas fa-user"></i> Account</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="cart-container">
    <!-- Header -->
    <div class="cart-header pt-5 pb-4">
      <a href="user-dashboard.html" class="btn btn-back">
        <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
      </a>
      <h1>My Cart</h1>
    </div>

    <div class="row g-4">
      <!-- Cart Items -->
      <div class="col-lg-8">
        <div class="cart-items-grid" id="cartItems"></div>
      </div>

      <!-- Summary Sidebar -->
      <div class="col-lg-4">
        <div class="cart-summary"></div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Project JS -->
  <script src="js/constants.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
