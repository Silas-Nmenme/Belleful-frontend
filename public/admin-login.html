<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Belleful</title>
    
    <!-- CDNs -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="css/admin-login.css">
    <link rel="stylesheet" href="css/logo.css">

</head>
<body class="pt-5">
    <!-- Navigation - like login.html -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top bg-gradient-warm shadow-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">
              <img src="asset/logo.jpeg" alt="Belleful" class="navbar-brand-logo" loading="lazy">
              <span>Belleful</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" 
            aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact-us.html">Contact</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user"></i> Account
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="login.html">Login</a></li>
                            <li><a class="dropdown-item" href="signup.html">Sign Up</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="admin-login.html">Admin Login</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
<div class="container pt-4">
        <div class="contact-box">
            <!-- Left Panel - Admin Welcome -->
            <div class="left">
                <i class="fas fa-user-shield"></i>
                <span>Admin Portal</span>
            </div>
            
            <!-- Right Panel - Login Form -->
            <div class="right">
                <h2>Secure Admin Login</h2>
                <form id="adminLoginForm" class="login-form" onsubmit="AuthManager.login(event)">
                    <input id="adminEmail" name="email" type="email" class="field" placeholder="admin@belleful.com" required>
                    <div class="password-wrapper">
                        <input id="adminPassword" name="password" type="password" class="field password-field" placeholder="Enter secure password" required>
                        <button type="button" id="toggleAdminPassword" class="password-toggle" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <button id="adminLoginSubmit" class="btn" type="submit">
                        <i class="fas fa-sign-in-alt me-2"></i>Admin Login
                    </button>
                    <div class="forgot-password">
                        <a href="reset-password.html">
                            <i class="fas fa-key me-1"></i>Forgot Password?
                        </a>
                    </div>
                </form>
            </div>
        </div> 
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script>
        AOS.init({ duration: 1200, once: true });
        
        // Set admin mode
        localStorage.setItem('authMode', 'admin');
        
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('adminLoginForm');
            const toggleBtn = document.getElementById('toggleAdminPassword');
            const passwordField = document.getElementById('adminPassword');
            const submitBtn = document.getElementById('adminLoginSubmit');
            
            // Password toggle
            toggleBtn.addEventListener('click', function() {
                const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordField.setAttribute('type', type);
                this.querySelector('i').classList.toggle('fa-eye');
                this.querySelector('i').classList.toggle('fa-eye-slash');
            });
            
            // Simplified like login.html - AuthManager handles validation
        });
    </script>
</body>
</html>
