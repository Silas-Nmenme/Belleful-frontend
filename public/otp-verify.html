<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Belleful</title>
    
    <!-- Same CDNs as signup.html -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="css/otp-verify.css">
</head>
<body class="pt-5">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top bg-gradient-warm shadow-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-utensils me-2"></i>Belleful
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" 
            aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#menu" id="menuLink">Menu</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cart.html">
                            <i class="fas fa-shopping-cart"></i> Cart 
                            <span class="badge bg-danger cart-count hidden">0</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact-us.html">Contact</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user"></i> Account
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="login.html">Login</a></li>
                            <li><a class="dropdown-item" href="signup.html">Sign Up</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="admin-login.html">Admin Login</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

<div class="container-fluid pt-5 px-3 px-md-4">
        <div class="contact-box mx-auto my-4 w-100" style="max-width: 950px;">
            <div class="left">
                <i class="fas fa-shield-check me-2"></i><span>Verify Your Account</span>
            </div>
            <div class="right">
                <h2>Enter OTP Code</h2>
                <p class="mb-4 text-muted" id="emailDisplay">Code sent to your email</p>
                
                <form id="otpForm" onsubmit="AuthManager.verifyOTP(event)">
                    <input type="hidden" id="otpEmail" name="email">
                    
                    <!-- Timer -->
                    <div class="timer mb-4 text-center" id="timer">
                        <span id="countdown">02:00</span>
                        <br><small>Time remaining</small>
                    </div>
                    
                    <!-- OTP Inputs -->
                    <div class="otp-inputs mb-4">
                        <input type="text" class="otp-input field" maxlength="1" inputmode="numeric" autocomplete="one-time-code" data-index="0" placeholder="0">
                        <input type="text" class="otp-input field" maxlength="1" inputmode="numeric" autocomplete="one-time-code" data-index="1" placeholder="0">
                        <input type="text" class="otp-input field" maxlength="1" inputmode="numeric" autocomplete="one-time-code" data-index="2" placeholder="0">
                        <input type="text" class="otp-input field" maxlength="1" inputmode="numeric" autocomplete="one-time-code" data-index="3" placeholder="0">
                        <input type="text" class="otp-input field" maxlength="1" inputmode="numeric" autocomplete="one-time-code" data-index="4" placeholder="0">
                        <input type="text" class="otp-input field" maxlength="1" inputmode="numeric" autocomplete="one-time-code" data-index="5" placeholder="0">
                    </div>
                    
                    <button type="submit" class="btn w-100 mb-3" id="verifyBtn" disabled>
                        Verify OTP
                    </button>
                    
                    <div class="resend-section text-center">
                        <button type="button" class="btn-link text-muted" id="resendBtn" disabled>Resend OTP</button>
                    </div>
                    
                    <div id="otpMessage"></div>
                    
                    <div class="account-links mt-4 text-center">
                        <a href="login.html" class="text-primary fw-bold text-decoration-none">
                            Back to Login
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts matching signup flow -->
    <script src="js/constants.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/otp-verify.js"></script>
</body>
</html>
