<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Belleful</title>
    
    <!-- CDNs -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="css/otp-verify.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top bg-gradient-primary shadow-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-utensils me-2"></i>Belleful
            </a>
        </div>
    </nav>

    <!-- OTP Section -->
    <section class="otp-hero min-vh-100 d-flex align-items-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6 col-xl-5" data-aos="fade-up">
                    <div class="otp-card">
                        <div class="text-center mb-5">
                            <div class="logo-circle mb-4">
                                <i class="fas fa-shield-check fa-3x text-success"></i>
                            </div>
                            <h1 class="display-5 fw-bold mb-3">Verify OTP</h1>
                            <p class="lead text-muted mb-1" id="emailDisplay">Enter code sent to your email</p>
                            <div class="timer mb-4" id="timer">
                                <span id="countdown">02:00</span>
                            </div>
                        </div>
                        
                        <form id="otpForm" class="otp-form">
                            <div class="otp-inputs mb-4">
                                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" autocomplete="one-time-code" data-index="0">
                                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" autocomplete="one-time-code" data-index="1">
                                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" autocomplete="one-time-code" data-index="2">
                                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" autocomplete="one-time-code" data-index="3">
                                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" autocomplete="one-time-code" data-index="4">
                                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" autocomplete="one-time-code" data-index="5">
                            </div>
                            
                            <button type="submit" class="btn btn-success btn-lg w-100 py-3 fw-bold mb-3" id="verifyBtn" disabled>
                                <span class="btn-text">
                                    <i class="fas fa-check me-2"></i>Verify OTP
                                </span>
                                <span class="spinner-border spinner-border-sm d-none ms-2" role="status"></span>
                            </button>
                            
                            <div class="resend-section text-center">
                                <button type="button" class="btn btn-link text-muted" id="resendBtn" disabled>
                                    <i class="fas fa-redo me-1"></i>Resend OTP
                                </button>
                            </div>
                            
                            <div id="otpMessage" class="text-center mt-4"></div>
                        </form>
                        
                        <div class="text-center mt-4">
                            <a href="login.html" class="text-muted text-decoration-none fw-medium">
                                <i class="fas fa-arrow-left me-2"></i>Back to Login
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Simple Footer -->
    <footer class="text-center py-4 bg-dark text-white">
        <p class="mb-0 small">&copy; 2026 Belleful. Secure & Fast.</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/otp-verify.js"></script>
    <script>AOS.init({duration: 1000, once: true});</script>
</body>
</html>
