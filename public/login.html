<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Belleful</title>
    
    <!-- Same CDNs as index.html -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/logo.css">

    </head>
<body class="pt-5">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top bg-gradient-warm shadow-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">
              <img src="asset/logo.jpeg" alt="Belleful" class="navbar-brand-logo" loading="lazy">
              <span>Belleful</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" 
            aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact-us.html">Contact</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user"></i> Account
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="login.html">Login</a></li>
                            <li><a class="dropdown-item" href="signup.html">Sign Up</a></li>
                           <!--<li><a class="dropdown-item" href="user-dashboard.html">Dashboard</a></li>--> 
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="admin-login.html">Admin Login</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container pt-4">
        <div class="contact-box">
            <div class="left">
                <i class="fas fa-utensils me-2"></i><span>Welcome to Belleful</span>
            </div>
            <div class="right">
                <h2> Login</h2>
                <form id="loginForm" class="login-form" onsubmit="AuthManager.login(event)">
                    <input id="loginEmail" name="email" type="email" class="field" placeholder="Enter Your Email" required>
                    <div class="password-wrapper">
                        <input id="loginPassword" name="password" type="password" class="field password-field" placeholder="Enter Your Password" required>
                        <button id="togglePassword" type="button" aria-label="Show password" class="password-toggle">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <button id="loginFormSubmit" class="btn" type="submit">Login</button>
                    <div class="forgot-password mt-4 text-center">
                        <a href="reset-password.html" class="text-muted text-decoration-none">
                            <i class="fas fa-key me-1"></i>Forgot Password?
                        </a>
                    </div>
                    <div class="signup-link mt-3 text-center">
                        <span class="text-muted">Don&apos;t have an account? </span>
                        <a href="signup.html" class="text-primary fw-bold text-decoration-none">
                            Sign Up Here
                        </a>
                    </div>
                </form>
            </div>
        </div> 
    </div>
    <!-- Auth scripts: constants first, then auth logic -->
    <script src="js/constants.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
