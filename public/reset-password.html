<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Belleful</title>
    
    <!-- CDNs -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="css/reset-password.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top bg-gradient-primary shadow-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-utensils me-2"></i>Belleful
            </a>
        </div>
    </nav>

    <!-- Hero Form Section -->
    <section class="reset-hero min-vh-100 d-flex align-items-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6 col-xl-5" data-aos="fade-up">
                    <div class="reset-card">
                        <div class="text-center mb-5">
                            <div class="logo-circle mb-4">
                                <i class="fas fa-key fa-3x text-primary"></i>
                            </div>
                            <h1 class="display-5 fw-bold text-white mb-3">Reset Password</h1>
                            <p class="lead text-white-50 mb-0">Enter your email to receive a 6-digit verification code.</p>
                        </div>
                        
                        <form id="resetForm" class="reset-form">
                            <div class="form-floating mb-4">
                                <input type="email" class="form-control" id="resetEmail" name="email" placeholder="name@example.com" required>
                                <label for="resetEmail"><i class="fas fa-envelope me-2"></i>Email Address</label>
                                <div class="invalid-feedback"></div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary btn-lg w-100 py-3 fw-bold mb-3" id="sendOtpBtn">
                                <span class="btn-text">
                                    <i class="fas fa-paper-plane me-2"></i>Send OTP Code
                                </span>
                                <span class="spinner-border spinner-border-sm d-none ms-2" role="status"></span>
                            </button>
                            
                            <div id="resetMessage" class="text-center"></div>
                        </form>
                        
                        <div class="text-center mt-4">
                            <a href="login.html" class="text-white text-decoration-none fw-medium">
                                <i class="fas fa-arrow-left me-2"></i>Back to Login
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer Simple -->
    <footer class="text-center py-4 bg-dark text-white">
        <p class="mb-0">&copy; 2026 Belleful. All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/reset-password.js"></script>
    <script>AOS.init({duration: 1000, once: true});</script>
</body>
</html>
