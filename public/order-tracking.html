<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracking - Belleful</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="css/user-dashboard.css">
    <link rel="stylesheet" href="css/logo.css">

    <!-- Firebase SDK for Push Notifications -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js';
        import { getMessaging, getToken, onMessage } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging.js';

        // Initialize Firebase
        const app = initializeApp(window.FIREBASE_CONFIG);
        const messaging = getMessaging(app);

        // Make messaging available globally
        window.FirebaseMessaging = { app, messaging, getToken, onMessage };

        // Register service worker for push notifications
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(registration => {
                    console.log('Service Worker registered for order tracking');
                })
                .catch(error => {
                    console.log('Service Worker registration failed:', error);
                });
        }
    </script>

</head>
<body>
    <!-- Top Navbar (simple back) -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top bg-gradient-warm shadow-lg">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="user-dashboard.html">
                <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
            </a>
        </div>
    </nav>

    <div class="app-wrapper">
        <div class="main-content">
            <div class="container mt-5 pt-4">
                <!-- Loading -->
                <div id="loadingScreen" class="text-center py-5">
                    <div class="spinner-border text-primary mb-4" style="width: 4rem; height: 4rem;" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <h4>Loading order details...</h4>
                    <p class="text-muted">Fetching your order status</p>
                </div>

                <!-- Error -->
                <div id="errorScreen" class="alert alert-danger d-none" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <strong>Order not found</strong>
                    <p class="mb-0">This order doesn't exist or you don't have access.</p>
                    <a href="user-dashboard.html" class="btn btn-primary mt-2">View Orders</a>
                </div>

                <!-- Order Tracking Main -->
                <div id="trackingScreen" class="d-none">
                    <!-- Header -->
                    <div class="row mb-5">
                        <div class="col-12">
                            <h1 class="h2 fw-bold mb-1"><i class="fas fa-map-marker-alt text-primary me-2"></i>Track Order</h1>
                            <p class="lead text-muted mb-0">#<span id="orderId"></span></p>
                        </div>
                    </div>

                    <!-- Progress Bar (Large) -->
                    <div class="card shadow-lg border-0 mb-5">
                        <div class="card-body p-5">
                            <div class="progress mb-4" style="height: 12px;">
                                <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%"></div>
                            </div>
                            <div class="text-center">
                                <h3 id="statusText" class="mb-2 fw-bold">Loading...</h3>
                                <p id="statusSubtext" class="text-muted mb-0 fs-5">Updating...</p>
                                <small class="text-muted">Last updated: <span id="lastUpdated"></span></small>
                            </div>
                        </div>
                    </div>

                    <!-- Order Details Grid -->
                    <div class="row g-4 mb-5">
                        <div class="col-lg-8">
                            <div class="card shadow border-0">
                                <div class="card-header bg-light border-bottom">
                                    <h5 class="mb-0 fw-bold"><i class="fas fa-utensils me-2 text-primary"></i>Your Order</h5>
                                </div>
                                <div class="card-body">
                                    <div id="itemsList">
                                        <!-- Items loaded here -->
                                    </div>
                                    <hr>
                                    <div class="d-flex justify-content-between">
                                        <span class="h5 fw-bold">Total:</span>
                                        <span id="orderTotal" class="h4 fw-bold text-success">₦0</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-lg-4">
                            <div class="card shadow border-0 h-100">
                                <div class="card-header bg-light border-bottom">
                                    <h5 class="mb-0 fw-bold"><i class="fas fa-truck me-2 text-info"></i>Delivery Info</h5>
                                </div>
                                <div class="card-body">
                                    <div id="deliveryInfo">
                                        <!-- Delivery details -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Controls -->
                    <div class="text-center">
                        <button id="refreshBtn" class="btn btn-primary btn-lg px-5 me-3">
                            <i class="fas fa-sync-alt me-2"></i>Refresh Status
                        </button>
                        <button onclick="window.location.href='user-dashboard.html'" class="btn btn-outline-secondary btn-lg px-5">
                            <i class="fas fa-list me-2"></i>View All Orders
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init();</script>
    <script src="../js/constants.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        // Config
        if (typeof window.API_BASE === 'undefined') {
            window.API_BASE = window.location.hostname.includes('vercel.app') 
                ? 'https://belleful-gold.vercel.app/api' 
                : '/api';
        }

        // Status config - matches dashboard labels
        const statusConfig = {
            'pending_approval': {width: '25%', color: 'success', text: 'Pending', sub: 'Payment verification in progress'},
            'vendor_approved': {width: '40%', color: 'success', text: 'Approved', sub: 'Order approved by vendor'},
            'preparing': {width: '60%', color: 'success', text: 'Preparing', sub: 'Your meal is being cooked fresh'},
            'ready_for_pickup': {width: '80%', color: 'success', text: 'Ready for Pickup', sub: 'Order complete and ready'},
            'ready': {width: '80%', color: 'success', text: 'Ready', sub: 'Order complete and waiting'},
            'off_for_delivery': {width: '90%', color: 'success', text: 'On the Way', sub: 'Driver assigned and heading your way'},
            'delivered': {width: '100%', color: 'success', text: 'Delivered ✓', sub: 'Enjoy your meal!'},
            'cancelled': {width: '0%', color: 'danger', text: 'Cancelled', sub: 'Order was cancelled'}
        };

        let pollInterval;
        let currentOrderStatus = null;
        const orderId = new URLSearchParams(window.location.search).get('id');

        async function loadOrder() {
            try {
                const token = localStorage.getItem('token');
                if (!token || !orderId) {
                    showError('Authentication required or invalid order ID');
                    return;
                }

                const response = await fetch(`${window.API_BASE}/orders/my-orders/${orderId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) {
                    throw new Error(`Status ${response.status}: ${response.statusText}`);
                }

                const { data: order } = await response.json();
                if (!order) {
                    throw new Error('Order not found');
                }

                displayOrder(order);
                document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();
            } catch (error) {
                console.error('Load order error:', error);
                showError(error.message);
            }
        }

        function displayOrder(order) {
            // Show screen
            document.getElementById('loadingScreen').classList.add('d-none');
            document.getElementById('trackingScreen').classList.remove('d-none');
            document.getElementById('orderId').textContent = order._id.slice(-8).toUpperCase();

            // Detect status change and animate
            const statusChanged = currentOrderStatus !== order.orderStatus;
            const statusCard = document.querySelector('.card.shadow-lg.border-0');
            
            if (statusChanged && currentOrderStatus !== null) {
                // Pulse animation on status change
                statusCard?.classList.add('animate__animated', 'animate__pulse');
                setTimeout(() => {
                    statusCard?.classList.remove('animate__animated', 'animate__pulse');
                }, 1000);
            }
            
            currentOrderStatus = order.orderStatus;

            // Progress
            const status = statusConfig[order.orderStatus] || statusConfig['pending_approval'];
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = status.width;
            progressBar.className = `progress-bar progress-bar-striped progress-bar-animated bg-${status.color}`;
            document.getElementById('statusText').textContent = status.text;
            document.getElementById('statusSubtext').textContent = status.sub;

            // Items
            const itemsHtml = order.items.map(item => `
                <div class="d-flex align-items-center p-3 border-bottom">
                    <div class="flex-shrink-0 me-3">
                        <img src="${item.menuItem?.image || '/asset/food-placeholder.jpg'}" class="rounded" style="width: 60px; height: 60px; object-fit: cover;">
                    </div>
                    <div class="flex-grow-1">
                        <h6 class="mb-1">${item.name}</h6>
                        <small class="text-muted">x${item.quantity}</small>
                    </div>
                    <div class="text-end">
                        <strong>₦${(item.price * item.quantity).toLocaleString()}</strong>
                    </div>
                </div>
            `).join('');
            document.getElementById('itemsList').innerHTML = itemsHtml;

            // Total
            document.getElementById('orderTotal').textContent = `₦${order.totalAmount.toLocaleString()}`;

            // Delivery info
            const deliveryHtml = `
                <div class="mb-3">
                    <label class="fw-bold small text-muted mb-1">Phone:</label>
                    <div>${order.phoneNumber}</div>
                </div>
                <div class="mb-3">
                    <label class="fw-bold small text-muted mb-1">Delivery:</label>
                    <div>${order.deliveryMethod === 'delivery' ? '🚚 Delivery' : '📦 Pickup'}</div>
                </div>
                ${order.deliveryAddress ? `<div class="mb-3">
                    <label class="fw-bold small text-muted mb-1">Address:</label>
                    <div class="small">${order.deliveryAddress}</div>
                </div>` : ''}
                <div class="mb-3">
                    <label class="fw-bold small text-muted mb-1">Payment:</label>
                    <div>${order.bankName} (${order.bankAccount})</div>
                </div>
                <div class="mb-3">
                    <label class="fw-bold small text-muted mb-1">Date:</label>
                    <div>${new Date(order.createdAt).toLocaleDateString()}</div>
                </div>
            `;
            document.getElementById('deliveryInfo').innerHTML = deliveryHtml;
        }

        function showError(msg) {
            document.getElementById('loadingScreen').classList.add('d-none');
            document.getElementById('errorScreen').classList.remove('d-none');
            document.querySelector('#errorScreen strong').innerHTML = msg;
        }

        // Events
        document.getElementById('refreshBtn').addEventListener('click', () => {
            document.getElementById('refreshBtn').innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Refreshing...';
            loadOrder().then(() => {
                document.getElementById('refreshBtn').innerHTML = '<i class="fas fa-sync-alt me-2"></i>Refresh Status';
            });
        });

        // Auto-poll
        function startPolling() {
            loadOrder();
            pollInterval = setInterval(loadOrder, 10000); // 10s
        }

        function stopPolling() {
            if (pollInterval) clearInterval(pollInterval);
        }

        // Pause polling when user leaves tab, resume when they return
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopPolling();
            } else {
                startPolling();
            }
        });

        // Init
        if (orderId) {
            startPolling();
        } else {
            showError('No order ID provided');
        }

        window.showToast = function(msg, type = 'info') {
            // Simple toast like dashboard
            console.log(`[${type}] ${msg}`);
        };

        // Cleanup on page exit
        window.addEventListener('beforeunload', stopPolling);
    </script>

    <!-- Core JavaScript Files -->
    <script src="js/constants.js"></script>
    <script src="js/auth-helpers.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
